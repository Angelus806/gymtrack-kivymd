name: Build Android APK (Kivy - en pausa)

# NOTA: se dejo de disparar automaticamente en cada push porque el build
# fallaba de forma persistente compilando "hostpython3" (incompatibilidad
# entre python-for-android y el toolchain actual de GitHub Actions, ver
# corridas #1 a #4). Se puede seguir ejecutando manualmente desde la
# pestana Actions si en el futuro se quiere retomar este camino (Kivy).
# Mientras tanto, el camino que SI compila es Capacitor (ver
# .github/workflows/build-apk-capacitor.yml y la carpeta capacitor_app/).
on:
  workflow_dispatch: {}

jobs:
  build:
    # Importante: fijo en 22.04 a proposito (necesita libtinfo5, que ya
    # no esta en versiones mas nuevas de Ubuntu). NO cambiar a "ubuntu-latest".
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Compilamos con buildozer directamente sobre el runner (sin Docker).
      # Antes se probo con las Actions de terceros ArtemSBulgakov y n8marti
      # (buildozer-action), pero ambas fallan actualmente porque sus
      # imagenes Docker no logran construirse (ver corridas #1 y #2:
      # "Docker build failed with exit code 1"). Este metodo es el
      # recomendado por la documentacion oficial de buildozer para CI.
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk-headless \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Instalar buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Forzar gcc-11 (el nativo de Ubuntu 22.04)
        # Seguro extra: el runner trae varias versiones de gcc instaladas
        # y a veces no usa la 11 por defecto, lo que puede afectar como
        # se compilan dependencias nativas de Android.
        run: |
          sudo apt-get install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
          sudo update-alternatives --set gcc /usr/bin/gcc-11
          sudo update-alternatives --set g++ /usr/bin/g++-11

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gymtrackpro-apk
          path: bin/*.apk
